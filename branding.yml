# branding.yml — Logo definitions for the Data Science Skills Factory ecosystem
# Read by the brand-kit skill to generate logo.png files.

# Brand identity
brand:
  name: Data Science Skills Factory
  tagline: "Production-grade skills for AI coding agents."
  source: fluent-3d  # Microsoft Fluent Emoji 3D

# Base mark — appears in every logo
base_mark:
  - emoji: "🏭"
    name: Factory
    role: "The brand anchor — built in the factory"

# Display sizes (height attribute in README <img> tags)
display:
  base_only:
    height: 97       # logos with just base mark (unused currently)
  with_suffix:
    height: 88       # base + suffix (most skills)
  repo_level:
    height: 97       # repo-level logo (more emojis, taller)

# Logo generation defaults
defaults:
  pixel_height: 168  # actual PNG height before README scaling
  gap: 8             # pixels between composited emojis
  background: transparent

# Repo-level logo — base mark goes LAST
repo:
  emojis: ["📊", "🔬", "✨", "🏭"]
  output: logo.png

# Sub-repos — sibling repos sharing the base mark
# (none for this ecosystem currently)
subrepos: {}

# Per-skill logos — base mark goes FIRST
skills:
  auto-format:
    suffix: ["🎨"]
    name: Artist palette
    reason: "Styling, formatting, beautification"

  langfuse-tracing:
    suffix: ["🪢"]
    name: Knot
    reason: "Traces, threads, connected spans"

  prd-karpathy-style:
    suffix: ["📋"]
    name: Clipboard
    reason: "Specs, documents, planning"

  qmd-search:
    suffix: ["🔍"]
    name: Magnifying glass
    reason: "Search, discovery, retrieval"

  brand-kit:
    suffix: ["🎪"]
    name: Circus tent
    reason: "The showroom, presentation, branding"

  plan-feature:
    suffix: ["🗺️"]
    name: Map
    reason: "Scope feature territory, staged traversal, you-are-here"

  repo-best-practices:
    suffix: ["🧭"]
    name: Compass
    reason: "Repo conventions, guardrails, agent navigation"

  tdd:
    suffix: ["🚦"]
    name: Vertical traffic light
    reason: "Red-Green-Refactor cycle"

  gpl-license-checker:
    suffix: ["🐃"]
    name: Water buffalo
    reason: "Stand-in for the GNU — block copyleft contamination at the gate"

  codespell:
    suffix: ["🧙‍♂️"]
    name: Man mage
    reason: "Spell-checker — casts corrections on typos in source and docs"

  langchain:
    suffix: ["🔗"]
    name: Link
    reason: "Chain of runnables — LCEL composition"

  langgraph:
    suffix: ["🕸️"]
    name: Spider web
    reason: "Nodes + edges — stateful agent graphs"

  mcp-python-sdk:
    suffix: ["🔌"]
    name: Electric plug
    reason: "Protocol wiring — servers plug into clients"

  python-telegram-bot:
    suffix: ["✈️"]
    name: Airplane
    reason: "Telegram's paper plane — messaging dispatch"
